thermocouple:
  type: "MAX6675"
  spi_device: "/dev/spidev0.1"
  spi_mode: 0
  spi_max_hz: 4000000
  samples_avg: 2

ssr:
  gpio_chip: "/dev/gpiochip1"
  gpio_line: 14
  active_high: true
  window_seconds: 1.0

motor:
  mode: "hardware"
  soft_pwm:
    gpio_chip: "/dev/gpiochip4"
    gpio_line: 19
    active_high: true
    pwm_hz: 1000
  hard_pwm:
    chip: 0
    channel: 0
    frequency_hz: 1000
  invert_pwm: false
  enables:
    r_en:
      gpio_chip: "/dev/gpiochip4"
      gpio_line: 8
      active_high: true
    l_en:
      gpio_chip: "/dev/gpiochip4"
      gpio_line: 22
      active_high: true

fan:
  gpio_chip: "/dev/gpiochip4"
  gpio_line: 6
  active_high: true
  default_on: false


inputs:
  stop_button:
    gpio_chip: "/dev/gpiochip4"
    gpio_line: 0
    pull: "up"        # "up" | "down" | "none"
    debounce_ms: 60   # rebote por sof


pid:
  kp: 35.2589
  ki: 0.3997
  kd: 777.404
  sample_seconds: 0.5
  output_limits: [0.0, 100.0]

autotune:
  enabled: false
  relay_high_percent: 50.0
  relay_low_percent: 0.0
  hysteresis_c: 0.5
  settle_cycles: 1
  cycles_target: 1
  rule: "zn_classic"

safety:
  absolute_max_c: 350.0
  sensor_fault_action: "cut"
  max_over_sp_c: 40.0

barcode:
  serial:
    enabled: false
    port: "/dev/ttyUSB2"
    baudrate: 9600
    timeout: 0.1

ui:
  poll_interval_seconds: 1
  appearance: Dark   # Dark | Light | System
  theme: dark-blue        # blue | green | dark-blue
  geometry: 1100x720
  settings_password: "admin123"


